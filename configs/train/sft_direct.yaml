# SFT (direct_label). One epoch, effective batch 16 (step budgets are equalised after the pilot; see PREREGISTRATION.md).
dataset_config: configs/pilot.yaml
base_model: Qwen/Qwen2.5-0.5B-Instruct
data: direct_label
output_dir: outputs/sft_direct-qwen0.5b
max_chars: 6000
max_length: 1536
lora: {r: 16, alpha: 32, dropout: 0.05}
train: {learning_rate: 1.0e-4, batch_size: 2, grad_accum: 8, epochs: 1, seed: 0}
