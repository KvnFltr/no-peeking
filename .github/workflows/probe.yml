# Score an open model with the look-ahead probe on free CPU runners (no GPU needed up to ~3B parameters).
# Work is spread over split x shard jobs; each uploads its cached predictions as an artifact, and
# `python scripts/merge_probe_run.py <run-id> [<rerun-id> ...]` merges them and computes the metrics locally.
# Jobs that hit the time limit still upload what they scored: rerun them with `only` and `resume_run`.
# Measured on a 4-vCPU runner at 512 tokens: ~3.4 s per prompt for Qwen2.5-0.5B (2,000 prompts per test split),
# growing roughly with the non-embedding parameter count; pick `shards` so that one job stays well under the
# 6-hour limit (1000 filings: 0.5B -> 1, 1.5B -> 3, 3B -> 6).
name: Probe (CPU)
on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model id
        required: true
        default: Qwen/Qwen2.5-0.5B-Instruct
      limit:
        description: Filings per split (seeded sample)
        required: true
        default: "1000"
      max_input_tokens:
        description: Prompt budget in tokens
        required: true
        default: "512"
      shards:
        description: Jobs per split
        required: true
        default: "4"
      dtype:
        description: auto (float32 on CPU) or bfloat16 for models that do not fit in 16 GB
        required: true
        default: auto
      only:
        description: "Optional subset of jobs to (re)run, e.g. test_pre:1,val:3 (empty = all)"
        required: false
        default: ""
      resume_run:
        description: Optional id of an earlier run of the same model; each job resumes from its artifact
        required: false
        default: ""
      data_release:
        description: Release tag holding the dataset parquet
        required: true
        default: data-v1
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only }}
        shell: python
        run: |
          import json, os
          n = int(os.environ["SHARDS"])
          only = {x.strip() for x in os.environ["ONLY"].split(",") if x.strip()}
          cells = [{"split": s, "shard": i} for s in ("test_pre", "test_post", "val") for i in range(n)]
          cells = [c for c in cells if not only or f"{c['split']}:{c['shard']}" in only]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": cells}) + "\n")
  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRED: results/v1/predictions
    steps:
      - uses: actions/checkout@v4
      - name: Prediction file name
        env:
          MODEL: ${{ inputs.model }}
        run: echo "PRED_FILE=probe__${MODEL//\//__}__${{ inputs.max_input_tokens }}.parquet" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[llm]"
      - name: Fetch dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/processed/v1
          gh release download "${{ inputs.data_release }}" -p "*.parquet" -p "*.json" -D data/processed/v1
          ls -la data/processed/v1
      - name: Resume from an earlier run
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.resume_run }}" -n "probe-${{ matrix.split }}-${{ matrix.shard }}" -D resume || true
          found=$(find resume -name "$PRED_FILE" | head -1)
          if [ -n "$found" ]; then mkdir -p "$PRED" && cp "$found" "$PRED/$PRED_FILE" && echo "resuming from $found"; fi
      - name: Probe
        run: >
          nopeeking -v probe "${{ inputs.model }}" --config configs/v1.yaml --splits ${{ matrix.split }}
          --limit ${{ inputs.limit }} --max-input-tokens ${{ inputs.max_input_tokens }} --device cpu
          --dtype ${{ inputs.dtype }} --batch-size 4 --no-market --shard ${{ matrix.shard }}/${{ inputs.shards }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.split }}-${{ matrix.shard }}
          path: |
            ${{ env.PRED }}/${{ env.PRED_FILE }}
            logs/probe.log
