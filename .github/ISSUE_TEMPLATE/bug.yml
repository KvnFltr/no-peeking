name: Bug report
description: Something in the pipeline or the metrics looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and config to reproduce
  - type: input
    id: version
    attributes:
      label: nopeeking version / commit
