name: Leaderboard submission
description: Add a model to the look-ahead leaderboard
title: "[leaderboard] <model id>"
labels: [leaderboard]
body:
  - type: input
    id: model
    attributes:
      label: Hugging Face model id
      placeholder: org/model-name
    validations:
      required: true
  - type: input
    id: released
    attributes:
      label: Public release (YYYY-MM), must be before 2025-07 for the post-cutoff test to be unseen
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command you ran
      value: nopeeking probe <model> --config configs/v1.yaml
  - type: textarea
    id: notes
    attributes:
      label: Hardware, dtype, anything unusual
